<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cumple de Cristóbal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css?v=helado3" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-kicker" id="brand-kicker">Hoy cumple</p>
            <h1 id="brand-title">Cristóbal</h1>
          </div>
        </div>
        <nav class="tabs" aria-label="Secciones">
          <button class="tab is-active" data-view="carta" type="button">Carta</button>
          <button class="tab" data-view="pedidos" type="button">
            Cocina
            <span class="badge" id="orders-count" hidden>0</span>
          </button>
        </nav>
      </header>

      <main>
        <section id="view-carta" class="view is-visible">
          <div class="hero">
            <p id="hero-kicker">Arma tu pedido</p>
            <h2 id="hero-title">Elige hamburguesa o helado.</h2>
          </div>
          <div id="menu-board" class="menu-board"></div>
        </section>

        <section id="view-pedidos" class="view">
          <div class="hero">
            <p id="kitchen-hero-kicker">Cocina</p>
            <h2>Pedidos en cocina</h2>
          </div>
          <div class="kitchen-bar" role="tablist" aria-label="Filtro de cocina">
            <button class="filter is-active" data-filter="cocina" type="button">En cocina</button>
            <button class="filter" data-filter="lista" type="button">Listas</button>
            <button class="filter" data-filter="todas" type="button">Todas</button>
          </div>
          <p class="sound-hint" id="sound-hint" hidden>
            Toca la pantalla para activar el aviso sonoro de pedidos nuevos.
          </p>
          <p class="kitchen-note" id="kitchen-note"></p>
          <div id="orders-list" class="orders-list"></div>
        </section>
      </main>
    </div>

    <dialog id="customizer" class="sheet">
      <form id="order-form" class="sheet-body">
        <button class="close" id="close-sheet" type="button" aria-label="Cerrar">×</button>
        <div class="sheet-visual">
          <div id="sheet-illu" class="burger-illu" data-style="clasica"></div>
        </div>
        <div class="sheet-copy">
          <p class="eyebrow" id="sheet-price"></p>
          <h3 id="sheet-name"></h3>
          <p id="sheet-desc"></p>
        </div>
        <fieldset id="fieldset-ingredients">
          <legend>Ingredientes</legend>
          <p class="hint">Quita o deja lo que quieras. Mínimo uno.</p>
          <div id="ingredient-list" class="chips"></div>
        </fieldset>
        <fieldset id="fieldset-serving" hidden>
          <legend>¿Cómo lo quieres?</legend>
          <p class="hint">Cono, vaso o ambos.</p>
          <div id="serving-list" class="chips"></div>
        </fieldset>
        <fieldset id="fieldset-flavors" hidden>
          <legend>Sabores</legend>
          <p class="hint" id="flavors-hint">Elige al menos uno.</p>
          <div id="flavor-list" class="chips"></div>
        </fieldset>
        <label class="field">
          <span>Nombre de quien pide</span>
          <input
            id="customer-name"
            name="customerName"
            maxlength="60"
            autocomplete="name"
            placeholder="Ej. Ana Pérez"
          />
        </label>
        <p class="form-error" id="form-error" hidden></p>
        <button class="cta" id="submit-order" type="button">Generar orden</button>
      </form>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <div id="confetti" class="confetti" hidden></div>
    <script src="/js/app.js?v=helado2"></script>
  </body>
</html>
