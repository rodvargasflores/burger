<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Burger Box</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-kicker">Estación local</p>
            <h1>Burger Box</h1>
          </div>
        </div>
        <nav class="tabs" aria-label="Secciones">
          <button class="tab is-active" data-view="carta" type="button">Carta</button>
          <button class="tab" data-view="pedidos" type="button">
            Pedidos
            <span class="badge" id="orders-count" hidden>0</span>
          </button>
        </nav>
      </header>

      <main>
        <section id="view-carta" class="view is-visible">
          <div class="hero">
            <p>Arma tu pedido</p>
            <h2>Elige hamburguesa, ingredientes y tu nombre.</h2>
          </div>
          <div id="menu-grid" class="menu-grid"></div>
        </section>

        <section id="view-pedidos" class="view">
          <div class="hero">
            <p>Cocina / mostrador</p>
            <h2>Pedidos generados</h2>
          </div>
          <div id="orders-list" class="orders-list"></div>
        </section>
      </main>
    </div>

    <dialog id="customizer" class="sheet">
      <form method="dialog" id="order-form" class="sheet-body">
        <button class="close" value="cancel" type="submit" aria-label="Cerrar">×</button>
        <div class="sheet-visual">
          <div id="sheet-burger" class="burger-illu" data-style="clasica"></div>
        </div>
        <div class="sheet-copy">
          <p class="eyebrow" id="sheet-price"></p>
          <h3 id="sheet-name"></h3>
          <p id="sheet-desc"></p>
        </div>
        <fieldset>
          <legend>Ingredientes</legend>
          <p class="hint">Quita o deja lo que quieras. Mínimo uno.</p>
          <div id="ingredient-list" class="chips"></div>
        </fieldset>
        <label class="field">
          <span>Nombre de quien pide</span>
          <input
            id="customer-name"
            name="customerName"
            maxlength="60"
            autocomplete="name"
            placeholder="Ej. Ana Pérez"
            required
          />
        </label>
        <p class="form-error" id="form-error" hidden></p>
        <button class="cta" id="submit-order" type="button">Generar orden</button>
      </form>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <script src="/js/app.js"></script>
  </body>
</html>
